# New Wave Midnightclub por Alucard Fagner versão modificada!
# Agradecimentos especiais à Rockstar Games
#
# Consulte a documentação para obter mais informações sobre a configuração do servidor:
#   https://aka.cfx.re/server-commands
#   https://docs.fivem.net/docs/server-manual/setting-up-a-server/
#
# Documentação da API para desenvolvedores do New Wave Midnightclub:
#   https://github.com/New Wave Midnightclub-fivem/New Wave Midnightclub/blob/main/SK_API.md

## Configurações que VOCÊ DEVE editar:
sv_hostname "New Wave Midnightclub FREE!" # Define o nome exibido na lista de servidores
sets sv_projectName "[New Wave Midnightclub] CLEAN" # Define o nome do projeto exibido no servidor
sets sv_projectDesc "New Wave Midnightclub is a freeroam street racing gamemode for FiveM where you can race solo or compete against up to 20 other players. Earn XP to level up your character and vehicle, progressing through five classes - STARTER, C, B, A, and S. A curated list of races refreshes every day, with a bonus reward for players who complete them as they all. A mini-campaign of cinematic story missions introduces players to its theme and setting." # Define a descrição do projeto exibida no servidor
sets tags "racing, New Wave Midnightclub" # Define as palavras-chave usadas para encontrar o servidor
sets locale "root-AQ" # Substitua pelo código de idioma e região, como en-US ou pt-BR

## Configurações que VOCÊ PODE editar:
sv_enforceGameBuild 3751 # Define a versão obrigatória do jogo usada pelo servidor
sv_licenseKey "SUA CHAVE KEY AQUI" # Substitua pela sua chave de licença do FiveM
sv_maxclients 48 # Define o número máximo de jogadores permitidos
endpoint_add_tcp "0.0.0.0:30120" # Abre a porta TCP usada pelo servidor
endpoint_add_udp "0.0.0.0:30120" # Abre a porta UDP usada pelo servidor
set steam_webApiKey "none" # Chave da API Web da Steam; substitua por uma chave válida se necessário
load_server_icon "SKIcon.png" # Define o ícone exibido na lista de servidores
set mysql_connection_string "mysql://root@localhost/nwmidnightclub?charset=utf8mb4" # Configura a conexão com o banco de dados MySQL


## Permissões ##
# Permite que o grupo administrador execute todos os comandos
add_ace group.admin command allow

# Recursos
# Permite que o recurso principal execute comandos do servidor
add_ace resource.New Wave Midnightclub command allow

# Ox_lib
# Permite que o ox_lib gerencie as permissões ACE necessárias
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow

# Grupos ACE
# Concede as permissões básicas dos grupos administrador, moderador e suporte
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow

# Herança de grupos
# Cada grupo herda automaticamente as permissões do grupo abaixo
add_principal group.admin group.mod
add_principal group.mod group.support

add_principal identifier.fivem: group.admin # Adiciona Alucard_Fagner ao grupo administrador

## Configurações diversas ##
set sv_pureLevel 2 # Define o nível de verificação de integridade dos arquivos
set sv_enableNetworkedSounds false # Desativa sons sincronizados pela rede
set sv_enableNetworkedScriptEntityStates false # Desativa estados sincronizados de entidades criadas por scripts
setr sv_showBusySpinnerOnLoadingScreen false # Oculta o indicador de carregamento ocupado na tela de entrada

# Dependências
# Inicia os recursos básicos necessários pelo servidor
ensure oxmysql
ensure ox_lib
ensure [standalone]

# New Wave Midnightclub
# Inicia os recursos principais do modo de jogo e seus componentes visuais
ensure New Wave Midnightclub_audio
ensure New Wave Midnightclub_blips
ensure New Wave Midnightclub

# Recursos de assets
# Inicia os pacotes de recursos adicionais configurados na pasta [assets]
ensure [assets]
